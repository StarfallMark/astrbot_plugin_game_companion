<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f2f4f1" />
  <title>游戏伴侣</title>
  <link rel="stylesheet" href="../../assets/app.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"><i id="brandIcon" data-lucide="grid-3x3"></i></span>
        <div>
          <span class="eyebrow">游戏伴侣</span>
          <h1 id="gameTitle">棋类游戏</h1>
        </div>
      </div>
      <div class="room-state">
        <span id="connectionDot" class="connection-dot"></span>
        <span id="roomStatus">正在进入房间</span>
        <code id="roomId"></code>
      </div>
    </header>

    <section class="game-layout">
      <div class="board-stage">
        <canvas id="board" width="760" height="760" aria-label="棋盘"></canvas>
        <div id="boardOverlay" class="board-overlay" hidden>
          <strong id="overlayTitle"></strong>
          <span id="overlayText"></span>
        </div>
      </div>

      <section id="soupStage" class="soup-stage" hidden aria-label="海龟汤">
        <header class="soup-header">
          <div>
            <span class="label">本题汤面</span>
            <h2 id="soupTitle">正在准备题目</h2>
          </div>
          <span id="soupContentLevel" class="difficulty">普通</span>
        </header>
        <p id="soupSurface" class="soup-surface">Bot 正在构思一道新的海龟汤。</p>
        <dl class="soup-progress">
          <div><dt>提问</dt><dd id="soupQuestionCount">0</dd></div>
          <div><dt>提示</dt><dd id="soupHintCount">0 / 3</dd></div>
          <div><dt>答案尝试</dt><dd id="soupAnswerCount">0</dd></div>
          <div><dt>关键事实</dt><dd id="soupFactCount">0 / 0</dd></div>
        </dl>
        <p id="soupTurn" class="soup-turn" aria-live="polite"></p>
        <div id="soupHistory" class="soup-history" aria-live="polite"></div>
        <section id="soupSolution" class="soup-solution" hidden>
          <span class="label">完整汤底</span>
          <p id="soupSolutionText"></p>
        </section>
        <form id="soupComposer" class="soup-composer">
          <div class="soup-mode" role="group" aria-label="输入类型">
            <button type="button" data-soup-mode="ask" class="is-active">提问</button>
            <button type="button" data-soup-mode="answer">猜答案</button>
          </div>
          <textarea id="soupInput" rows="3" maxlength="200" placeholder="输入一个可以用是或否回答的问题"></textarea>
          <footer>
            <button id="soupHintAction" class="secondary-action" type="button" title="申请提示">
              <i data-lucide="lightbulb"></i><span>提示</span>
            </button>
            <button id="soupSubmitAction" class="primary-action compact" type="submit">
              <i data-lucide="send"></i><span>发送</span>
            </button>
            <button id="soupCorrectAction" class="secondary-action" type="button" hidden>
              <i data-lucide="badge-check"></i><span>Bot 猜中了</span>
            </button>
          </footer>
        </form>
      </section>

      <section id="diceStage" class="dice-stage" hidden aria-label="贪心骰子">
        <header class="dice-header">
          <div>
            <span class="label">贪心骰子</span>
            <h2>继续冒险，还是及时收手</h2>
          </div>
          <span class="difficulty">目标 <strong id="diceTarget">50</strong> 分</span>
        </header>
        <div class="dice-scores" aria-label="当前分数">
          <div class="human"><span>玩家</span><strong id="diceHumanScore">0</strong></div>
          <div class="turn-bank"><span>本回合</span><strong id="diceTurnTotal">0</strong></div>
          <div class="bot"><span>Bot</span><strong id="diceBotScore">0</strong></div>
        </div>
        <div class="dice-table">
          <div id="diceCube" class="dice-cube waiting" aria-label="尚未掷骰">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
          <div class="dice-readout">
            <span class="label">当前状态</span>
            <strong id="diceStatus">等待开局</strong>
            <span id="diceRisk">Bot 风格：均衡</span>
          </div>
        </div>
        <div id="diceHistory" class="dice-history" aria-live="polite"></div>
        <footer class="dice-actions">
          <button id="diceRollAction" class="primary-action" type="button">
            <i data-lucide="dice-5"></i><span>继续掷</span>
          </button>
          <button id="diceHoldAction" class="secondary-action" type="button">
            <i data-lucide="hand"></i><span>收手存分</span>
          </button>
        </footer>
      </section>

      <aside class="game-panel">
        <section class="turn-panel">
          <div class="turn-stone" id="turnStone"></div>
          <div>
            <span class="label">当前回合</span>
            <strong id="turnLabel">等待开局</strong>
          </div>
          <span class="difficulty" id="difficulty">普通</span>
        </section>

        <section class="seat-panel">
          <div class="section-head">
            <div>
              <span class="label">我的身份</span>
              <strong id="visitorLabel">访客</strong>
            </div>
            <span id="seatBadge" class="seat-badge">观众席</span>
          </div>
          <div class="side-choice" id="sideChoice" role="group" aria-label="选择先后手">
            <button type="button" data-side="human_black" class="is-active">我先手</button>
            <button type="button" data-side="bot_black">Bot先手</button>
            <button type="button" data-side="random">随机</button>
          </div>
          <button id="seatAction" class="primary-action" type="button" disabled>
            <i data-lucide="log-in"></i><span>加入对局</span>
          </button>
          <p id="seatNote" class="seat-note"></p>
        </section>

        <section class="score-panel" aria-label="房间比分">
          <div><span id="humanScoreLabel">玩家</span><strong id="humanScore">0</strong></div>
          <div><span id="drawScoreLabel">平局</span><strong id="drawScore">0</strong></div>
          <div><span id="botScoreLabel">Bot</span><strong id="botScore">0</strong></div>
        </section>

        <section class="people-panel">
          <div class="section-head">
            <div>
              <span class="label">房间成员</span>
              <strong id="peopleCount">0 人</strong>
            </div>
            <i data-lucide="users"></i>
          </div>
          <div id="peopleList" class="people-list"></div>
        </section>

        <section class="messages-panel">
          <div class="section-head">
            <span class="label">局内回应</span>
            <i data-lucide="message-circle"></i>
          </div>
          <div id="messages" class="messages" aria-live="polite"></div>
        </section>
      </aside>
    </section>
  </main>

  <div id="toast" class="toast" hidden role="status"></div>
  <script src="../../assets/lucide.min.js"></script>
  <script src="../../assets/app.js"></script>
</body>
</html>
